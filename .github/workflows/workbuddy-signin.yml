name: WorkBuddy 自动签到（云端兜底）

# 云端那份的职责：本机关机/睡眠那天，由 GitHub 的 runner 顶上，保证连签不断。
# 与本机计划任务跑的是同一个 signin.py、同一套接口、同一条幂等逻辑：
# 当天已签会直接返回「已签过」，因此两边同时开着也不会重复领取。

on:
  schedule:
    # 注意：GitHub 的 cron 一律按 UTC 计。北京时间 = UTC + 8。
    # 一天两次、刻意避开整点——官方文档明确写了高负载时整点延迟严重，
    # 排队中的任务甚至会被直接丢弃，所以准点没有意义，跑得到才有意义。
    # 实测 2026-10 高负载时队列积压可达 6~7 小时，因此班次尽量往早放：
    # 05:43 的班即使被压 6.5 小时也落在当天中午（跨天需延迟 >18h，不可能）。
    - cron: '43 21 * * *'   # 北京时间 05:43（早班，抗延迟主力）
    - cron: '43 4 * * *'    # 北京时间 12:43（午班兜底，跨天需延迟 >11h）
  workflow_dispatch:        # 支持手动触发，方便首次验证

# 同一条流水线不并发：两次触发撞在一起时排队，不并行领取
concurrency:
  group: workbuddy-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 还原凭据 + 冒烟校验。这一步是踩过坑之后加的守卫：
      # 如果 Secret 里塞的还是加密信封（$wbEncrypted），直接报「导出的是加密态」并停下，
      # 否则后面只会跑出一个看不懂的失败。
      - name: 还原凭据并做冒烟校验
        env:
          AUTH_INFO: ${{ secrets.WORKBUDDY_AUTH_INFO }}
        run: |
          set -euo pipefail
          if [ -z "${AUTH_INFO:-}" ]; then
            echo "::error::缺少 Secret WORKBUDDY_AUTH_INFO，请先在本机运行 export-credential.py --write 后写入仓库 Secret"
            exit 1
          fi
          AUTH_DIR="$RUNNER_TEMP/auth"
          mkdir -p "$AUTH_DIR"
          umask 077
          printf '%s' "$AUTH_INFO" > "$AUTH_DIR/workbuddy-desktop.info"

          python - "$AUTH_DIR/workbuddy-desktop.info" <<'PY'
          import json, sys
          p = sys.argv[1]
          try:
              s = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              raise SystemExit(f"::error::Secret 不是合法 JSON（{type(e).__name__}）")
          tok = (s.get("auth") or {}).get("accessToken")
          if isinstance(tok, dict) or tok is None:
              raise SystemExit("::error::导出的是加密态，云端无法解密；请在本机用 export-credential.py --write 重新导出明文凭据")
          if not isinstance(tok, str) or not tok:
              raise SystemExit("::error::accessToken 不是明文非空字符串，请重新导出")
          print("凭据冒烟校验通过（明文 accessToken，长度 %d）" % len(tok))
          PY

      # 网络抖动自愈：runner 在海外，访问腾讯域名会抖，签到这一步包一层重试。
      # 只重试签到类操作——状态查询是只读的，领取接口本身幂等，重试不会重复领。
      - name: 签到 + 成长中心
        id: signin
        env:
          WORKBUDDY_AUTH_FILE: ${{ runner.temp }}/auth/workbuddy-desktop.info
          WORKBUDDY_BUDGET_SECONDS: '420'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "----- 第 $attempt 次尝试 -----"
            if python signin.py auto | tee "$RUNNER_TEMP/out.json"; then
              break
            fi
            echo "本次运行失败，15 秒后重试（只重试签到，接口幂等不会重复领）"
            sleep 15
          done

      - name: 汇总结果
        id: summary
        if: always()
        run: |
          python - "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/summary.env" <<'PY'
          import json, os, sys
          src, dst = sys.argv[1], sys.argv[2]
          result, report, attention = "ERROR", "未拿到脚本输出（可能被中断或超时）", "true"
          total = streak = credit = None
          try:
              d = json.load(open(src, encoding="utf-8"))
              result = str(d.get("result", "UNKNOWN"))
              report = str(d.get("report", "")) or "（脚本未给出 report）"
              growth = d.get("growth")
              if growth:
                  report += "；成长中心：" + str(growth)
              attention = "true" if d.get("needs_attention") else "false"
              total = d.get("total_credits")
              streak = d.get("streak_days")
              credit = d.get("credit") if d.get("credit") is not None else d.get("today_credit")
          except Exception:
              pass
          ok = result in ("SUCCESS", "CLAIMED", "ALREADY", "GROWTH")
          with open(dst, "w", encoding="utf-8") as f:
              f.write("SIGNIN_OK=%s\n" % ("true" if ok else "false"))
              f.write("SIGNIN_RESULT=%s\n" % result)
              f.write("REPORT=%s\n" % report.replace("\n", " "))
              f.write("ATTENTION=%s\n" % attention)
              f.write("TOTAL_CREDITS=%s\n" % ("" if total is None else total))
              f.write("STREAK_DAYS=%s\n" % ("" if streak is None else streak))
              f.write("CREDIT=%s\n" % ("" if credit is None else credit))
          # 结果状态的中文释义：日志里不再出现裸状态码
          RESULT_DESC = {
              "CLAIMED": "本次实际签到成功，积分已入账",
              "ALREADY": "今日已签过（本班或本机已领，幂等跳过）",
              "SUCCESS": "签到成功",
              "GROWTH": "成长中心领取完成",
              "ERROR": "执行出错",
          }
          print("result=%s（%s） ok=%s" % (result, RESULT_DESC.get(result, "未知状态"), ok))
          print(report)
          PY
          cat "$RUNNER_TEMP/summary.env" >> "$GITHUB_ENV"

      # 每班都推：这张通知就是该班任务的「心跳」——收到 = 这班确实跑了。
      # 推送逻辑全部在 notify.py（普通文件，Contents API 可直接更新，无需 workflow scope），
      # 四通道自适应：配了哪个 Secret 就走哪个通道，可同时配多个：
      #   FEISHU_WEBHOOK      飞书群机器人（交互卡片）
      #   WECOM_WEBHOOK       企业微信群机器人（markdown 消息）
      #   SERVERCHAN_SENDKEY  Server酱（个人微信）
      #   WXTEST_APPID / WXTEST_SECRET / WXTEST_OPENID / WXTEST_TEMPLATE_ID
      #                       微信公众平台测试号（个人微信，免费无限制）
      - name: 推送通知（飞书 / 企业微信 / Server酱 / 微信测试号）
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXTEST_APPID: ${{ secrets.WXTEST_APPID }}
          WXTEST_SECRET: ${{ secrets.WXTEST_SECRET }}
          WXTEST_OPENID: ${{ secrets.WXTEST_OPENID }}
          WXTEST_TEMPLATE_ID: ${{ secrets.WXTEST_TEMPLATE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          RUN_STARTED: ${{ github.run_started_at }}
          RUN_ID: ${{ github.run_id }}
        run: python notify.py
      - name: 清理凭据
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth"
